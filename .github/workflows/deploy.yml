name: CI/CD Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Code Syntax
        run: |
          python -m py_compile server.py
          python -m py_compile backend/app.py
          python -m py_compile backend/run.py

  deploy:
    name: Deploy to Server via SSH
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/indiawall-ai-calling-system' }}"
            
            echo "🚀 Starting Deployment in: $DEPLOY_PATH"
            
            # 1. Create directory if not exists & pull latest code
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Cloning repository..."
              mkdir -p "$DEPLOY_PATH"
              git clone https://github.com/indiawalls/indiawall-ai-calling-system.git "$DEPLOY_PATH"
            fi
            
            cd "$DEPLOY_PATH"
            echo "Pulling latest changes from main branch..."
            git fetch --all
            git reset --hard origin/main
            
            # 2. Deploy using Docker Compose (Recommended)
            if command -v docker compose >/dev/null 2>&1; then
              echo "🐳 Deploying via Docker Compose..."
              docker compose down --remove-orphans || true
              docker compose build
              docker compose up -d
            elif command -v docker-compose >/dev/null 2>&1; then
              echo "🐳 Deploying via legacy docker-compose..."
              docker-compose down --remove-orphans || true
              docker-compose build
              docker-compose up -d
            else
              # 3. Fallback: Native Python / Systemd Deployment
              echo "⚙️ Deploying natively with Python..."
              if [ ! -d "venv" ]; then
                python3 -m venv venv
              fi
              . venv/bin/activate
              pip install --upgrade pip
              pip install -r requirements.txt
              python scripts/download_models.py
              
              if systemctl is-active --quiet indiawall-ai-calling; then
                sudo systemctl restart indiawall-ai-calling
              fi
            fi
            
            echo "✅ Deployment completed successfully!"
